[project]
name = "shadow-saver"
version = "0.1.0"
description = "WeChat official account entry point for affiliate offer lookup"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "wechatpy==1.8.18", "cryptography>=44"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

